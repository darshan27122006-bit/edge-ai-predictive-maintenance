version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edge_ai_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./predictive_maintenance.db
      - DEVICE_AUTH_TOKEN=esp32-secret-iot-token-2026
      - ALERT_COOLDOWN_SECONDS=30
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edge_ai_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
